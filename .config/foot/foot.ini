[main]
font=JetBrainsMono Nerd Font Mono:style=Regular:size=14
#font-bold=Iosevka Nerd Font Bold:size=14
#font-italic=Iosevka Nerd Font Italic:size=14
#font-bold-italic=Iosevka Nerd Font Bold Italic:size=14
pad=10x10

[cursor]
style=block

[colors-dark]
alpha=0.9
background=131318
foreground=d5d2c1
regular0=17171c
regular1=a95a5c
regular2=7a8c72
regular3=b09e7e
regular4=90a2c6
regular5=988aad
regular6=738c85
regular7=bdb99e
bright0=595968
bright1=c14b4b
bright2=96ab7c
bright3=d2bd98
bright4=8eaebb
bright5=9690a3
bright6=839f99
bright7=d5d2c1

selection-background=1a1a23
selection-foreground=f7f6f0
cursor=0f0a12 f7f6f0

[scrollback]
multiplier=2.0

[key-bindings]
font-increase=Control+plus
font-decrease=Control+minus
font-reset=Control+0

[text-bindings]
# Ctrl+Left/Right: skip whole words
\x1b[1;5C=Control+Right
\x1b[1;5D=Control+Left
# Ctrl+Backspace: delete whole word backward
\x17=Control+BackSpace
